name: Construire DofusAuto.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Vérifier la détection (tests)
        run: python tests/test_vision.py

      - name: Construire le .exe
        run: pyinstaller --onefile --windowed --name DofusAuto main.py

      - name: Préparer le dossier final
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path livraison | Out-Null
          Copy-Item dist/DofusAuto.exe livraison/
          Copy-Item -Recurse assets livraison/assets
          Copy-Item config.json, LISEZMOI.txt livraison/

      - uses: actions/upload-artifact@v4
        with:
          name: DofusAuto
          path: livraison/
